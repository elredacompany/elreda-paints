    <!-- Early PWA Install Capture & Aggressive Social In-App Browser Redirect -->
    <script>
      (function () {
        try {
          window.__deferredPWAInstallPrompt = null;
          window.__pwaInstalled = false;

          window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__deferredPWAInstallPrompt = e;
            window.dispatchEvent(new CustomEvent('alreda:beforeinstallprompt'));
          });

          window.addEventListener('appinstalled', function () {
            window.__deferredPWAInstallPrompt = null;
            window.__pwaInstalled = true;
            window.dispatchEvent(new CustomEvent('alreda:appinstalled'));
          });

          var isEmbedded = false;
          try {
            isEmbedded = window.self !== window.top;
          } catch (_) {
            isEmbedded = true;
          }
          if (isEmbedded) return;

          var isStandalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            window.navigator.standalone === true ||
            (document.referrer && document.referrer.indexOf('android-app://') !== -1);
          if (isStandalone) return;

          var ua = navigator.userAgent || '';
          var isInApp = /FBAN|FBAV|FB_IAB|FBIOS|FB4A|Messenger|Orca-Android|Instagram|WhatsApp|TikTok|BytedanceWebview|musical_ly|ByteLocale|Aweme|trill|Snapchat/i.test(ua);
          if (!isInApp) return;

          document.documentElement.setAttribute('data-in-app-browser', 'true');

          var isAndroid = /Android/i.test(ua);
          if (isAndroid) {
            var guardKey = 'alreda_android_intent_v1';
            var alreadyAttempted = false;
            try {
              alreadyAttempted = window.sessionStorage.getItem(guardKey) === '1';
            } catch (_) {}

            if (!alreadyAttempted) {
              try {
                window.sessionStorage.setItem(guardKey, '1');
              } catch (_) {}

              var scheme = (window.location.protocol || 'https:').replace(':', '') || 'https';
              var targetNoProto =
                window.location.host +
                window.location.pathname +
                window.location.search +
                window.location.hash;
              var intentUrl =
                'intent://' +
                targetNoProto +
                '#Intent;scheme=' +
                scheme +
                ';package=com.android.chrome;S.browser_fallback_url=' +
                encodeURIComponent(window.location.href) +
                ';end';
              window.location.replace(intentUrl);
            }
          }
        } catch (_) {}
      })();
    </script>
