<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لا يوجد اتصال بالإنترنت | شركة الرضا للدهانات والديكور</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 36px 26px;
      max-width: 390px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #ffffff;
      padding: 8px;
      object-fit: contain;
      margin: 0 auto 18px;
      display: block;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      opacity: 0.92;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    button {
      width: 100%;
      background: #ffffff;
      color: #5a67d8;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="container">
    <img src="/pwa-192x192.png" alt="شركة الرضا للدهانات والديكور" class="logo" />
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من اتصالك بالإنترنت ثم أعد المحاولة للوصول إلى أحدث الأسعار والخدمات.</p>
    <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
